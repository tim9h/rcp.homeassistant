# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where your dependency manifests are located.
# Please see the documentation for all available configuration options:
# https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-version-updates/configuration-options

version: 2
updates:
  - package-ecosystem: "maven" # See documentation for possible values
    directory: "/" # Location of package manifests
    schedule:
      interval: "daily"
